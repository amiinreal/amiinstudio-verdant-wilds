name: Build launcher

on:
  push:
    branches: [main]
    paths:
      - "Launcher/**"
      - ".github/workflows/build-launcher.yml"
  pull_request:
    paths:
      - "Launcher/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish launcher (self-contained, single file)
        run: |
          dotnet publish Launcher/AmiinLauncher.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/launcher

      - name: Run update-check test suite
        run: dotnet run --project Launcher/tests/UpdateChecks.csproj

      - uses: actions/upload-artifact@v4
        with:
          name: AmiinLauncher-unsigned
          path: publish/launcher/AmiinLauncher.exe
