name: Release launcher

# Tag-triggered release pipeline:
#   restore -> build -> test -> publish -> sign the launcher exe (if configured)
#   -> verify -> package (zip, Inno Setup installer, MSIX) -> sign the installer
#   (if configured) -> verify -> SHA-256 hashes -> GitHub Release
#
# Signing is opt-in via repository secrets (see Launcher/SIGNING.md). Without
# them the pipeline still produces a full, correctly built release -- just
# unsigned, same as today. It never pretends to have signed something it
# didn't; if signing was expected (secrets present) and verification fails,
# the job fails.
#
# The MSIX artifact is INTENTIONALLY never self-signed here: it's meant for
# Microsoft Store submission, and Microsoft signs it during certification --
# see Launcher/SIGNING.md. Self-signing it first would only get in the way.

on:
  push:
    tags:
      - "launcher-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (a.b.c), e.g. 0.2.1"
        required: true
      require_signing:
        description: "Fail the job if Authenticode secrets are missing (instead of just warning)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}" -replace '^launcher-v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be a.b.c, got '$v'" }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "version4=$v.0" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Launcher/AmiinLauncher.csproj

      - name: Build
        run: dotnet build Launcher/AmiinLauncher.csproj -c Release --no-restore

      - name: Test (signed-manifest / update-check suite)
        run: dotnet run --project Launcher/tests/UpdateChecks.csproj

      - name: Publish (self-contained, single file, win-x64)
        run: |
          dotnet publish Launcher/AmiinLauncher.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.version }} -p:FileVersion=${{ steps.version.outputs.version4 }} `
            -o Releases/launcher-${{ steps.version.outputs.version }}

      - name: Check for Authenticode signing secrets
        id: signing
        shell: pwsh
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
        run: |
          $hasCert = -not [string]::IsNullOrEmpty($env:AUTHENTICODE_PFX_BASE64)
          echo "enabled=$($hasCert.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $hasCert) {
            if ("${{ inputs.require_signing }}" -eq "true") {
              throw "require_signing was set but AUTHENTICODE_PFX_BASE64 secret is not configured."
            }
            Write-Warning "No AUTHENTICODE_PFX_BASE64 secret configured -- shipping UNSIGNED artifacts."
            Write-Warning "See Launcher/SIGNING.md 'Enabling Authenticode signing later'."
          }

      # Signs (and immediately verifies) the launcher exe BEFORE it gets zipped or
      # embedded into the Inno Setup installer, so every downstream artifact carries
      # the signed payload rather than a stale unsigned copy.
      - name: Sign & verify launcher executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
          AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          . "${{ github.workspace }}/Launcher/Packaging/Sign-Verify.ps1" `
            -Target "Releases/launcher-${{ steps.version.outputs.version }}/AmiinLauncher.exe"

      - name: Zip direct-download package
        run: |
          python Online/zip_release.py Releases/launcher-${{ steps.version.outputs.version }} `
            Releases/AmiinLauncher-${{ steps.version.outputs.version }}-win-x64.zip

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found on this runner." }
          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=..\Releases\launcher-${{ steps.version.outputs.version }}" `
            Launcher/installer.iss
        # installer.iss's [Setup] OutputBaseFilename already includes the version,
        # and OutputDir is ..\Releases -- see Launcher/installer.iss. It embeds
        # whichever AmiinLauncher.exe already exists at that point, i.e. the
        # signed one from the previous step when signing is enabled.

      - name: Sign & verify installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          AUTHENTICODE_PFX_BASE64: ${{ secrets.AUTHENTICODE_PFX_BASE64 }}
          AUTHENTICODE_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_PFX_PASSWORD }}
          AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          . "${{ github.workspace }}/Launcher/Packaging/Sign-Verify.ps1" `
            -Target "Releases/AmiinLauncherSetup-${{ steps.version.outputs.version }}.exe"
        # The installer wrapper (Setup.exe) is a distinct PE binary from the
        # payload it embeds, so it needs its own signature too.

      - name: Build MSIX package (unsigned -- for Partner Center / Store certification)
        shell: pwsh
        run: |
          pwsh Launcher/Packaging/build-msix.ps1 -Version "${{ steps.version.outputs.version4 }}"
        continue-on-error: true
        id: msix
        # MSIX packaging needs makeappx.exe from the Windows SDK. If a runner
        # image ever lacks it, don't fail the whole release over the Store
        # artifact -- the direct-download zip/installer are the priority.
        # Deliberately never self-signed here -- see the header comment.

      - name: Generate SHA-256 hashes
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path Releases -File -Recurse | Where-Object {
            $_.Extension -in ".zip", ".exe", ".msix"
          }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Path Releases/SHA256SUMS.txt -Encoding utf8
          Get-Content Releases/SHA256SUMS.txt

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item Releases/AmiinLauncher-${{ steps.version.outputs.version }}-win-x64.zip artifacts/ -ErrorAction SilentlyContinue
          Copy-Item Releases/AmiinLauncherSetup-${{ steps.version.outputs.version }}.exe artifacts/ -ErrorAction SilentlyContinue
          Get-ChildItem Releases -Filter "AmiinLauncher-*.msix" | Copy-Item -Destination artifacts/ -ErrorAction SilentlyContinue
          Copy-Item Releases/SHA256SUMS.txt artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: AmiinLauncher-${{ steps.version.outputs.version }}
          path: artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: Launcher v${{ steps.version.outputs.version }}
          body: |
            Amiin Studio Launcher v${{ steps.version.outputs.version }}

            Authenticode-signed (exe + installer): ${{ steps.signing.outputs.enabled }}
            The .msix is intentionally UNSIGNED -- it's meant to be uploaded to
            Partner Center as-is; Microsoft signs it during Store certification.
            See SHA256SUMS.txt for integrity hashes and Launcher/SIGNING.md for
            what "signed" does and doesn't mean here.
